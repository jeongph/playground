rootProject.name = 'spring-playground'

include 'clients'
include 'clients:playground-client-web'; findProject(':clients:playground-client-web')?.name = 'playground-client-web'

include 'domains'
include 'domains:playground-domain-user'; findProject(':domains:playground-domain-user')?.name = 'playground-domain-user'

include 'modules'
